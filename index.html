<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meu roteiro · Festival DoSol 2026</title>
  <meta name="description" content="Monte seu roteiro de shows do Festival DoSol 2026 em Natal. App não oficial.">
  <meta name="theme-color" content="#151012">
  <link rel="icon" href="assets/rosa.svg">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/horizontal.css">
  <link rel="modulepreload" href="js/data.js">
  <link rel="modulepreload" href="js/schedule.js">
  <link rel="modulepreload" href="js/storage.js">
  <link rel="modulepreload" href="js/ui.js">
  <link rel="modulepreload" href="js/export-image.js">
  <link rel="modulepreload" href="js/theme.js">
  <link rel="modulepreload" href="js/share-link.js">
  <link rel="modulepreload" href="js/ui-horizontal.js">
  <script type="module" src="js/app.js"></script>
  <script data-goatcounter="https://dosol-2016.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>
<body>
  <div class="borda"></div>
  <header>
    <img src="assets/rosa.svg" alt="">
    <div>
      <h1>Meu roteiro · Festival DoSol 2026</h1>
      <p>Natal · Rua Chile</p>
    </div>
    <img src="assets/lua.svg" alt="">
  </header>
  <main>
    <nav class="abas" id="days" aria-label="Dia"></nav>
    <nav class="abas" aria-label="Visão">
      <button type="button" data-view="timeline">Programação</button>
      <button type="button" data-view="plan">Meu roteiro</button>
    </nav>
    <div class="abas" id="rotate-bar">
      <button type="button" id="rotate">⇆ Ver na horizontal</button>
    </div>
    <section id="timeline" aria-label="Programação por palco"></section>
    <div class="acoes fixa" id="go-bar">
      <button type="button" id="go" disabled>Gerar roteiro</button>
    </div>
    <section id="plan-view" hidden>
      <div id="plan"></div>
      <div class="acoes">
        <button type="button" id="export" disabled>Gerar imagem</button>
      </div>
      <div id="preview" aria-live="polite"></div>
      <div class="acoes">
        <button type="button" id="invite">Convidar para montar o seu</button>
      </div>
      <p id="invite-hint" class="aviso" aria-live="polite"></p>
    </section>
  </main>
  <footer>
    <img src="assets/cogumelo.svg" alt="">
    <p>App não oficial, feito por fã. Horários atualizados em 27/11, podem diferir do post e mudar. No Frisson, a duração é estimada. Contamos os acessos de forma anônima, sem cookies.</p>
    <p><a href="https://www.instagram.com/p/Df2ux8vH8Mr/" target="_blank" rel="noopener">Ver a programação no post original</a></p>
  </footer>
  <div class="borda base"></div>
</body>
</html>
